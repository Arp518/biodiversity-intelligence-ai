version: '3.8'

services:
  biodiversity-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biodiversity_intelligence_ai
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=8000
    env_file:
      - .env
    restart: unless-stopped

